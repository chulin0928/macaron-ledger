<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>馬卡龍記帳 Macaron Ledger</title>
    <meta name="description" content="A sweet, simple expense tracker. Private, offline, and every category is a macaron." />
    <meta name="theme-color" content="#FFF9F2" />
    <meta name="color-scheme" content="light" />
    <!-- Installable as a home-screen app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Macaron" />
    <meta property="og:title" content="Macaron Ledger" />
    <meta property="og:description" content="A sweet, simple expense tracker. Private, offline, and every category is a macaron." />
    <meta property="og:image" content="icons/og-image.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <noscript>馬卡龍記帳需要開啟 JavaScript 才能使用。</noscript>
    <div id="root"></div>
    <script type="module" src="js/boot.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
