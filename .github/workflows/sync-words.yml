name: Sync word cards from Google Drive

# Checks the shared Drive folder every hour and rebuilds words/data/ when files are
# added, changed or removed. Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_drive.py"
      - ".github/workflows/sync-words.yml"

permissions:
  contents: write

concurrency:
  group: sync-words
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Drive folder and rebuild data
        env:
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/sync_drive.py

      - name: Commit changes
        run: |
          git add words/data
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "word-cards-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update word cards from Google Drive"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
